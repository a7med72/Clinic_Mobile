# Codemagic CI/CD configuration for Clinic Mobile Flutter Application
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  # ============================================================================
  # Android Release Workflow
  # ============================================================================
  android-workflow:
    name: Android Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2 # Eligible for 500 free monthly minutes on personal accounts
    environment:
      flutter: stable
      java: 17
      # Uncomment the group below AFTER creating 'android_credentials' in Codemagic UI:
      # groups:
      #   - android_credentials
      vars:
        PACKAGE_NAME: "com.example.clinic_mobile"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter dependencies
        script: |
          flutter packages pub get

      - name: Run code generation (build_runner)
        script: |
          dart run build_runner build

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos

      - name: Flutter unit tests
        script: |
          flutter test

      - name: Configure Android keystore & key.properties
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Setting up production keystore from environment variables..."
            KEYSTORE_PATH="/tmp/keystore.keystore"
            echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
            cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
            echo "key.properties created successfully."
          else
            echo "CM_KEYSTORE variable not detected. Build will proceed using debug keys."
          fi

      - name: Build Android App Bundle (AAB) & Universal APK
        script: |
          # Build AAB for Google Play Store release
          flutter build appbundle --release

          # Build Universal APK for testing & direct distribution
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - dev-team@example.com
        notify:
          failure: true
          success: true

  # ============================================================================
  # iOS Release Workflow
  # ============================================================================
  ios-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2 # Eligible for 500 free monthly minutes on personal accounts
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Uncomment the group below AFTER creating 'appstore_credentials' in Codemagic UI:
      # groups:
      #   - appstore_credentials
      vars:
        BUNDLE_ID: "com.example.clinicMobile"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get

      - name: Run code generation (build_runner)
        script: |
          dart run build_runner build

      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos

      - name: Flutter unit tests
        script: |
          flutter test

      - name: Prepare iOS dependencies & CocoaPods
        script: |
          # Ensure Flutter prepares iOS project files
          flutter build ios --config-only
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install && cd ..
          fi

      - name: Configure iOS code signing
        script: |
          keychain initialize
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            echo "Configuring automatic code signing with App Store Connect API..."
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "No App Store Connect credentials set in Codemagic environment variables."
            echo "Workflow will proceed with an unsigned release build."
          fi

      - name: Build iOS Application
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            echo "Building signed App Store IPA..."
            flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
          else
            echo "Building unsigned iOS app..."
            flutter build ios --release --no-codesign
            # Package unsigned Runner.app into an unsigned .ipa archive
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r "$CM_BUILD_DIR/build/ios/Runner-unsigned.ipa" Payload
            cd "$CM_BUILD_DIR"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - dev-team@example.com
        notify:
          failure: true
          success: true
