name: clinic_mobile
description: "A new Flutter project."

publish_to: "none"

#
version: 1.0.0+1

environment:
  sdk: ^3.10.1
dependencies:
  flutter:
    sdk: flutter
  #A build system for Dart code generation and modular compilation
  # build_runner: ^2.4.7
  # State management
  flutter_bloc: ^9.1.1
  # Code generator (mainly used with cubit & retrofit)
  # freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  # for dependency injection
  get_it: ^9.2.1
  # Automatically generate code for converting to and from JSON by annotating Dart classes
  # json_serializable: ^6.13.2
  json_annotation: ^4.11.0
  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2
  # retrofit_generator: ^10.2.5
  pretty_dio_logger: ^1.4.0
  # localization
  intl: ^0.20.2
  flutter_localization:
  # for splash screen
  # flutter_native_splash: ^2.4.7
  # An SVG rendering and widget library for Flutter, which allows painting
  flutter_svg: ^2.2.4
  # for adapting screen and font size.
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.7.0
  # Flutter library to load and cache network images.
  cached_network_image: ^3.4.1
  # reading and writing simple key-value pairs
  shared_preferences: ^2.5.5
  # provides API to store data in secure storage.
  flutter_secure_storage: ^10.2.0
  # easy way to add shimmer effect
  shimmer: ^3.0.0
  # implementation of a Lottie player.
  lottie: ^3.3.3

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.13.2
  retrofit_generator: ^10.2.5
  freezed: ^3.2.5
  #Customize Flutter's default white native splash screen with background color and splash image.
  flutter_native_splash: ^2.4.7
  # A package that simplifies the process of generating app icons for both Android and iOS platforms.
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/image/
    - assets/lang/
  #   - images/a_dot_ham.jpeg
# this to make the image of the splash screen
flutter_native_splash:
  color: "#ffffff"
  image: assets/image/Logo.png
  branding: assets/image/branding.png
  android: true
  ios: true

  android_12:
    color: "#ffffff"
    image: assets/image/Logo.png
    branding: assets/image/branding.png
    icon_background_color: "#ffffff"

# this configuration to generate the app icon for both android and ios
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/icons.png"
  min_sdk_android: 21

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
